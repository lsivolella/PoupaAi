<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/lista.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols"/>
  <title>Lista de Compras</title>
</head>
<body>
  <header>
    <nav class="top-bar">
      <button class="btn-voltar" aria-label="Voltar">←</button>
      <h1>Lista de compras</h1>
    </nav>
  </header>

  <main>
    <section class="nome-lista">
      <label for="nome-lista">Nome</label>
      <input type="text" id="nome-lista" placeholder="Adicionar um nome para a lista">
    </section>

    <section class="tabela-itens">
      <header class="cabecalho-tabela">
        <span>Itens</span>
      </header>

      <ul class="lista-produtos">
        <li class="produto">
          <div class="imagem-produto">
            <img src="../assets/img/arroz_branco_camil_1kg.jpg" alt="Imagem do produto">
          </div>
          <div class="descricao-produto">
            <!-- Marca -->
            <h3>Camil</h3>
            <!-- Nome do Produto -->
            <p>Arroz Branco</p>
            <!-- Detalhes -->
            <p>1kg</p>
            <!-- Quantidade -->
            <p>Quantidade: <strong>01</strong></p>
          </div>
          <div class="acoes-produto">
            <button class="btn-editar" aria-label="Editar item">✏️</button>
            <button class="btn-excluir" aria-label="Excluir item">❌️</button>
          </div>
        </li>

        <li class="produto">
          <div class="imagem-produto">
            <img src="../assets/img/feijao_preto_kicaldo_1kg.png" alt="Imagem do produto">
          </div>
          <div class="descricao-produto">
            <!-- Marca -->
            <h3>Kicaldo</h3>
            <!-- Nome do Produto -->
            <p>Feijão Preto</p>
            <!-- Detalhes -->
            <p>1kg</p>
            <!-- Quantidade -->
            <p>Quantidade: <strong>01</strong></p>
          </div>
          <div class="acoes-produto">
            <button class="btn-editar" aria-label="Editar item">✏️</button>
            <button class="btn-excluir" aria-label="Excluir item">❌️</button>
          </div>
        </li>
      </ul>

      <div class="adicionar-produto">
        <button class="btn-adicionar">+ Adicionar produto</button>
      </div>
    </section>

    <section class="finalizar-lista">
      <button class="btn-finalizar">Finalizar a lista</button>
    </section>
  </main>


</body>
</html>
