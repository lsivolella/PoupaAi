<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/lista.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <title>Lista de Compras</title>
</head>
<body>
  <header>
    <nav class="top-bar">
      <button class="btn-voltar" aria-label="Voltar">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <h1>Lista de compras</h1>
    </nav>
  </header>

  <main>
    <section class="nome-lista">
      <label for="nome-lista">Nome</label>
      <input type="text" id="nome-lista" placeholder="Adicionar um nome para a lista">
    </section>

    <section class="tabela-itens">
      <header class="cabecalho-tabela">
        <span>Itens</span>
      </header>

      <ul class="lista-produtos">
        <li class="produto">
          <div class="imagem-produto">
            <img src="../assets/img/arroz_branco_camil_1kg.jpg" alt="Imagem do produto">
          </div>
          <div class="descricao-produto">
            <h3>Arroz Branco</h3>
            <p>Camil</p>
            <p>1kg</p>
            <p>Quantidade: <strong>01</strong></p>
          </div>
          <div class="acoes-produto">
            <a href="editar_produto.html" class="btn-editar" aria-label="Editar item">
              <span class="material-symbols-outlined">edit</span>
            </a>
            <button class="btn-excluir" aria-label="Excluir item">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </li>

        <li class="produto">
          <div class="imagem-produto">
            <img src="../assets/img/feijao_preto_kicaldo_1kg.png" alt="Imagem do produto">
          </div>
          <div class="descricao-produto">
            <h3>Feijão Preto</h3>
            <p>Kicaldo</p>
            <p>1kg</p>
            <p>Quantidade: <strong>01</strong></p>
          </div>
          <div class="acoes-produto">
            <a href="editar_produto.html" class="btn-editar" aria-label="Editar item">
              <span class="material-symbols-outlined">edit</span>
            </a>
            <button class="btn-excluir" aria-label="Excluir item">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </li>
      </ul>

      <div class="adicionar-produto">
        <a href="editar_produto.html" class="btn-adicionar">+ Adicionar produto</a>
      </div>
    </section>

    <section class="finalizar-lista">
      <button class="btn-finalizar">Finalizar a lista</button>
    </section>
  </main>


</body>
</html>
