<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/lista.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <title>Lista de Compras</title>
  <style>
    .container-nome-lista {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }
    #nome-lista {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    #btn-salvar-nome {
      background-color: #000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    #titulo-lista-fixo {
      display: none;
      font-size: 1.5rem;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #btn-editar-nome {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    #btn-editar-nome:hover {
      background: rgba(0, 0, 0, 0.1);
    }
    .escondido { display: none !important; }
  </style>
</head>
<body>
  <header>
    <nav class="top-bar">
      <button class="btn-voltar" aria-label="Voltar" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <h1>Lista de compras</h1>
    </nav>
  </header>

  <main>
    <section class="nome-lista">
      <label for="nome-lista">Nome da lista</label>
      
      <div id="area-input-nome" class="container-nome-lista">
          <input type="text" id="nome-lista" placeholder="Adicionar um nome para a lista">
          <button id="btn-salvar-nome">Salvar</button>
      </div>

      <h2 id="titulo-lista-fixo">
        <span id="texto-nome-lista"></span>
        <button id="btn-editar-nome" title="Editar nome da lista">
          <span class="material-symbols-outlined">edit</span>
        </button>
      </h2>
    </section>

    <section class="tabela-itens">
      <header class="cabecalho-tabela">
        <span>Itens</span>
      </header>

      <ul class="lista-produtos" id="lista-produtos"></ul>

      <div class="adicionar-produto">
        <a href="editar_produto.html" class="btn-adicionar">+ Adicionar produto</a>
      </div>
    </section>

    <section class="finalizar-lista">
      <button class="btn-finalizar" id="btn-finalizar">Finalizar a lista</button>
    </section>
  </main>

  <script src="../assets/js/lista.js"></script>
</body>
</html>
