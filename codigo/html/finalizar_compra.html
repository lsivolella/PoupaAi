<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="../assets/css/finalizar_compra.css">
    <link rel="stylesheet" href="">
</head>
<body>
    <header>
      <!--Retorna para a lista de compras-->
      <nav>
        <button><a href=""></a><</button>
      </nav>
      <img src="../assets/img/Logo_PoupaAI.svg" alt="PoupaAí">
      <h1>Carrinho</h1>
    </header>
    <main>
      <!--Mostra em qual supermercado a compra será feita-->
      <section>
        <h2>Sua compra será feita no supermercado: </h2>
        <img src="../assets/img/logo_verdemar.png" alt="Verdemar">
      </section>
      <!--Tabela com as informações do produto-->
      <section>
        <table border="1">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Quantidade</th>
              <th>Total</th>
              <!--Lembrar de tirar a legenda de remover do cabeçalho-->
            </tr>
          </thead>
          <tbody>
            <!--Produto 1-->
            <tr>
              <td>
                <figure>
                  <img src="../assets/img/pao_forma_integral_visconti_500g.png" alt="Pão de Forma Integral Visconti 500g">
                  <figcaption>Pão de Forma Integral Visconti 500g</figcaption>
                </figure>
              </td>
              <td>
                <span>R$ 9.00</span>
              </td>
              <td>
                <span>1</span>
                <button>+</button>
                <button>-</button>
              </td>
              <td>
                <span>R$ 9.00</span>
              </td>
            </tr>
            <!--Produto 2-->
            <tr>
              <td>
                <figure>
                  <img src="../assets/img/veja_multiuso_500ml.png" alt="Veja Multiuso 500ml">
                  <figcaption>Veja Multiuso 500ml</figcaption>
                </figure>
              </td>
              <td>
                <span>R$ 6.60</span>
              </td>
              <td>
                <span>1</span>
                <button>+</button>
                <button>-</button>
              </td>
              <td>
                <span>R$ 6.60</span>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
      <!--Informações Finais e frete-->
      <section>
        <h2>Resumo do Carrinho</h2>
        <p>Identificador do carrinho: <strong>#002</strong></p>
        <p>Sub-total: <strong>R$15.60</strong></p>
        <div class="calcular-frete">
          <span>Cálculo do frete: </span>
          <form>
            <input type="text" name="frete" id="frete" placeholder="Digite o seu CEP">
          </form>
        </div>
        <p>Valor do Frete: <strong>Grátis</strong></p>
        <p>Total: <strong>R$15.60</strong></p>
      </section>
      <!--Alterar lista e finalizar compra-->
      <section>
        <button><a style="color: black;" class="botoes-finais" href="../html/lista.html">Alterar a lista</a></button>
        <button onclick="alert('Compra Finalizada')"><a class="botoes-finais" href="../html/historico_de_compras.html">Finalizar compra</a></button>
      </section>
    </main>
    <footer>

    </footer>
  </body>
</html>
