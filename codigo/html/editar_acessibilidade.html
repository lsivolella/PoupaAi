<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Acessibilidade</title>
    <link rel="stylesheet" href="../assets/css/acessibilidade.css" />
  </head>
  <body class="modo-edicao">
    <!-- Cabeçalho Edição -->
    <div id="tela-editar">
      <div class="cabecalho-edicao">
        <button class="botao-voltar" id="botao-voltar">‹</button>
        <h2 class="titulo-edicao">Editar acessibilidade</h2>
      </div>

      <!-- Conteúdo Edição -->
      <div class="conteudo-edicao">
        <div class="item-edicao">
          <span class="nome-item">Rampa de acesso</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="rampa"
              data-valor="true"
              onclick="marcarOpcao('rampa', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="rampa"
              data-valor="false"
              onclick="marcarOpcao('rampa', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="rampa"
              data-valor="null"
              onclick="marcarOpcao('rampa', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="item-edicao">
          <span class="nome-item">Elevador</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="elevador"
              data-valor="true"
              onclick="marcarOpcao('elevador', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="elevador"
              data-valor="false"
              onclick="marcarOpcao('elevador', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="elevador"
              data-valor="null"
              onclick="marcarOpcao('elevador', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="item-edicao">
          <span class="nome-item">Vagas PCD</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="vagas"
              data-valor="true"
              onclick="marcarOpcao('vagas', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="vagas"
              data-valor="false"
              onclick="marcarOpcao('vagas', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="vagas"
              data-valor="null"
              onclick="marcarOpcao('vagas', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="item-edicao">
          <span class="nome-item">Piso tátil</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="piso"
              data-valor="true"
              onclick="marcarOpcao('piso', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="piso"
              data-valor="false"
              onclick="marcarOpcao('piso', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="piso"
              data-valor="null"
              onclick="marcarOpcao('piso', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="item-edicao">
          <span class="nome-item">Sinalização braille</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="braille"
              data-valor="true"
              onclick="marcarOpcao('braille', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="braille"
              data-valor="false"
              onclick="marcarOpcao('braille', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="braille"
              data-valor="null"
              onclick="marcarOpcao('braille', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="item-edicao">
          <span class="nome-item">Fila preferencial</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="preferencial"
              data-valor="true"
              onclick="marcarOpcao('preferencial', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="preferencial"
              data-valor="false"
              onclick="marcarOpcao('preferencial', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="preferencial"
              data-valor="null"
              onclick="marcarOpcao('preferencial', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="item-edicao">
          <span class="nome-item">Funcionário de libras</span>
          <div class="botoes-opcao">
            <button
              class="botao-opcao"
              data-campo="libras"
              data-valor="true"
              onclick="marcarOpcao('libras', true)"
            >
              Sim
            </button>
            <button
              class="botao-opcao"
              data-campo="libras"
              data-valor="false"
              onclick="marcarOpcao('libras', false)"
            >
              Não
            </button>
            <button
              class="botao-opcao limpar"
              data-campo="libras"
              data-valor="null"
              onclick="marcarOpcao('libras', null)"
            >
              Limpar
            </button>
          </div>
        </div>

        <div class="secao-comentarios">
          <label class="label-comentarios">Comentários</label>
          <textarea
            class="campo-comentarios"
            id="comentarios"
            placeholder="Adicione um comentário"
          ></textarea>
        </div>
      </div>

      <div class="botoes-acao">
        <button class="botao-salvar" onclick="salvarAlteracoes()">
          Salvar
        </button>
        <button class="botao-cancelar" id="botao-cancelar">Cancelar</button>
      </div>
    </div>

    <script src="../assets/js/acessibilidade.js"></script>
  </body>
</html>
