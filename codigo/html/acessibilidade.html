<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acessibilidade</title>
    <link rel="stylesheet" href="../assets/css/acessibilidade.css" />
  </head>
  <body>
    <!-- Cabeçalho -->
    <div id="tela-visualizar">
      <div class="cabecalho">
        <div class="logo">
          <img
            src="../assets/img/Logo_PoupaAI.svg"
            alt="PoupaAí"
            class="img-logo"
          />
        </div>
      </div>

      <!-- Barra de pesquisa -->
      <div class="barra-busca">
        <input
          type="text"
          class="campo-busca"
          placeholder="Buscar por mercados..."
        />
      </div>

      <!-- Filtros -->
      <div class="filtros">
        <button class="botao-filtro">
          <span class="icone-filtro">♿</span>
          <span>Acessibilidade</span>
        </button>
        <button class="botao-filtro">
          <span class="icone-filtro">❤️</span>
          <span>Favoritos</span>
        </button>
      </div>

      <!-- Título Supermercado -->
      <div class="conteudo-principal">
        <button
          class="botao-voltar"
          onclick="window.location.href='mapa_supermercados.html'"
        >
          ‹
        </button>
        <h2 class="nome-loja">Carregando...</h2>

        <div class="card-acessibilidade">
          <div class="titulo-card" id="titulo-card">
            <span class="icone-acessibilidade">♿</span>
            <span id="status-acessibilidade">Sem informação</span>
          </div>
          <!-- data da última atualização -->
          <div class="data-atualizacao" id="data-atualizacao"></div>
          <ul class="lista-acessibilidade" id="lista-acessibilidade">
            <!-- itens de acessibilidade estão presentes no Javascript -->
          </ul>
        </div>

        <!-- Comentários -->
        <div class="card-comentarios escondido" id="card-comentarios">
          <div class="titulo-comentarios">💬 Comentários</div>
          <div class="texto-comentarios" id="mostrar-comentarios"></div>
        </div>
      </div>

      <a
        href="#"
        class="botao-editar"
        id="botao-editar"
        onclick="irParaEditar(event)"
        >Editar informações</a
      >
    </div>
    <script src="../assets/js/acessibilidade.js"></script>
  </body>
</html>
