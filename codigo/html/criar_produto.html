<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/criar_produto.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols" />
    <title>Criar Produto</title>
</head>

<body>
    <header>
        <div>
            <a href="#" class="btn align-items-center" , id="back-button">
                <span class="material-symbols">
                    chevron_left
                </span>
            </a>
        </div>
        <div id="titulo-produto">
            <h4>Novo produto</h4>
        </div>
    </header>

    <main>
        <div class="container">
            <form class="card p-4" id="produto-form">
                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="nome" class="form-label mb-0">Nome</label>
                    </div>
                    <div class="col-9">
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome"
                            required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="marca" class="form-label mb-0">Marca</label>
                    </div>
                    <div class="col-9">
                        <input type="text" class="form-control" id="marca" name="marca" placeholder="Digite a marca"
                            required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="unidade" class="form-label mb-0">Unidade de Medida</label>
                    </div>
                    <div class="col-9">
                        <select class="form-control" id="unidade" name="unidade" required>
                            <option value="">Unidade de medida</option>
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="mg">mg</option>
                            <option value="l">litro</option>
                            <option value="ml">mililitro</option>
                            <option value="un">unidade</option>
                            <option value="m">metro</option>
                            <option value="cm">centímetro</option>
                            <option value="dz">dúzia</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="embalagem" class="form-label mb-0">Tamanho Embalagem</label>
                    </div>
                    <div class="col-9">
                        <input type="number" class="form-control" id="embalagem" name="embalagem"
                            placeholder="Digite o tamanho da embalagem" min="0" step="any" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="descricao" class="form-label mb-0">Descrição</label>
                    </div>
                    <div class="col-9">
                        <textarea class="form-control" id="descricao" name="descricao" rows="3"
                            placeholder="Digite a descrição"></textarea>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="imagem" class="form-label mb-0">Imagem</label>
                    </div>
                    <div class="col-9">
                        <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*">
                        <div class="imagem-preview-container">
                            <img id="preview-imagem">
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3 d-flex align-items-center">
                        <label for="mercados" class="form-label mb-0">Mercados</label>
                    </div>

                    <div class="col-9">
                        <div class="mb-3">
                            <button type="button" class="form-control mb-3" id="adicionar-mercado-btn">
                                Adicionar Mercado
                            </button>
                        </div>

                        <div id="lista-mercados">
                            <!-- preenchido dinamicamente -->
                        </div>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="botao-generico" id="submitBtn">Criar Produto</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="../assets/js/criar-produto.js"></script>
</body>

</html>
