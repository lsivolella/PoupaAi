<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermercados</title>
    <link rel="stylesheet" href="../assets/css/lista_supermercados.css" />
  </head>
  <body>
    <!-- Cabeçalho -->
    <div class="cabecalho">
      <div class="logo">
        <img
          src="../assets/img/Logo_PoupaAI.svg"
          alt="PoupaAí"
          class="img-logo"
        />
      </div>
    </div>

    <!-- Barra de pesquisa -->
    <div class="barra-busca">
      <input
        type="text"
        class="campo-busca"
        id="campo-busca"
        placeholder="Buscar por mercados..."
      />
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <button class="botao-filtro ativo" data-filtro="todos">
        <span>Todos</span>
      </button>
      <button class="botao-filtro" data-filtro="com-acessibilidade">
        <span class="icone-filtro">♿</span>
        <span>Com Acessibilidade</span>
      </button>
      <button class="botao-filtro" data-filtro="sem-acessibilidade">
        <span>Sem Acessibilidade</span>
      </button>
    </div>

    <!-- Botão Mapa -->
    <div class="container-botao-mapa">
      <button
        class="botao-mapa"
        onclick="window.location.href='mapa_supermercados.html'"
      >
        🗺️ Ver no Mapa
      </button>
    </div>

    <!-- Lista de Supermercados -->
    <div class="conteudo-principal">
      <div class="contador-resultados" id="contador-resultados">
        Carregando...
      </div>
      <div class="lista-supermercados" id="lista-supermercados">
        <!-- Preenchido via JavaScript -->
      </div>
    </div>

    <script src="../assets/js/lista_supermercados.js"></script>
  </body>
</html>
