<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro Supermercados</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <header class="container py-4 text-center">
    <img src="../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo poupa aí, carrinho de compras">
  </header>

  <main class="container">
    <h1 class="mb-4 text-center">Cadastro de Supermercados</h1>
    <form id="formCadastro">
      <div class="mb-3">
        <label for="nomeMercado" class="form-label">Nome do Mercado</label>
        <input type="text" class="form-control" id="nomeMercado" placeholder="Ex: Supermercado Central">
      </div>

      <fieldset class="border rounded p-3 mb-4">
        <legend class="float-none w-auto px-2 fs-5">Endereço</legend>

        <div class="row g-3">
          <div class="col-md-4">
            <label for="cepMercado" class="form-label">CEP</label>
            <input type="text" class="form-control" id="cepMercado" placeholder="Ex: 30170-131">
          </div>
          <div class="col-md-8">
            <label for="ruaMercado" class="form-label">Rua</label>
            <input type="text" class="form-control" id="ruaMercado" placeholder="Ex: Rua Bias Fortes">
          </div>
          <div class="col-md-4">
            <label for="numeroMercado" class="form-label">Número</label>
            <input type="text" class="form-control" id="numeroMercado" placeholder="Ex: 500">
          </div>
          <div class="col-md-6">
            <label for="bairroMercado" class="form-label">Bairro</label>
            <input type="text" class="form-control" id="bairroMercado" placeholder="Ex: Centro">
          </div>
          <div class="col-md-6">
            <label for="cidadeMercado" class="form-label">Cidade</label>
            <input type="text" class="form-control" id="cidadeMercado" placeholder="Ex: Belo Horizonte">
          </div>
          <div class="col-md-6">
            <label for="estadoMercado" class="form-label">Estado</label>
            <input type="text" class="form-control" id="estadoMercado" placeholder="Ex: MG">
          </div>
          <div class="col-md-6">
            <label for="paisMercado" class="form-label">País</label>
            <input type="text" class="form-control" id="paisMercado" placeholder="Ex: Brasil">
          </div>
        </div>    
      </fieldset>

      <fieldset class="border rounded p-3 mb-4">
          <legend class="float-none w-auto px-2 fs-5">Informações de contato</legend>

          <div class="mb-3">
            <label for="telefoneMercado" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefoneMercado" placeholder="Ex: (31) 98888-7777">
          </div>
          
          <div class="mb-3">
            <label for="emailMercado" class="form-label">E-mail de Contato</label>
            <input type="email" class="form-control" id="emailMercado" placeholder="Ex: contato@super.com">
          </div>
      </fieldset>

      <div class="mb-3">
        <label for="acessibilidadeMercado" class="form-label">Acessibilidade</label>
        <select id="acessibilidadeMercado" class="form-select" multiple>
          <option value="rampa">Rampa</option>
          <option value="elevador">Elevador</option>
          <option value="vagas">Vagas Preferenciais</option>
          <option value="piso">Piso Tátil</option>
          <option value="braille">Sinalização em Braille</option>
          <option value="preferencial">Atendimento Preferencial</option>
          <option value="libras">Atendimento em Libras</option>
        </select>
        <small class="text-muted">Segure CTRL para selecionar várias opções</small>
      </div>      

      <div class="mb-3">
        <label for="imagemMercado" class="form-label">Imagem do Mercado</label>
        <input class="form-control" type="file" id="imagemMercado" accept="image/png, image/jpeg, image/svg">
      </div>      

      <div style="margin-top:10px;">
        <button id="btnCadastrar" type="button" class="btn btn-primary mb-3">Cadastrar</button>
      </div>
    </form>
  </main>

  <script src="../assets/js/cadastro_supermercados.js"></script>
</body>
</html>
