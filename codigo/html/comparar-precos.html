<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoupaAi — Comparativo de Preços</title>
  <link rel="stylesheet" href="../assets/css/compara-preco.css">
</head>
<body>
  <!-- Header -->
  <header>
    <button type="button" aria-label="Voltar" onclick="history.back()">←</button>
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <h1>Poupa<span class="logo-azul">Ai</span></h1>
    </div>
  </header>

  <!-- Abas -->
  <div class="abas">
    <button class="aba ativa" data-aba="busca">Buscar Produto</button>
    <button class="aba" data-aba="listas">Comparar Lista</button>
  </div>

  <!-- Aba 1: Buscar Produto -->
  <div id="aba-busca" class="conteudo-aba ativa">
    <div class="busca">
      <div class="busca-container">
        <span class="icone-busca">🔍</span>
        <input type="search" id="campo-busca" placeholder="Pesquise o produto aqui (ex: arroz, feijão...)" autocomplete="off">
      </div>
    </div>

    <div class="secao-header" id="secao-header-busca" style="display: none;">
      <span class="secao-titulo" id="nome-produto-buscado">PRODUTOS</span>
      <span class="secao-info" id="btn-ordenar-busca">
        PREÇO
        <div class="setas-ordenacao">
          <span class="seta" id="seta-cima-busca">▲</span>
          <span class="seta ativa" id="seta-baixo-busca">▼</span>
        </div>
      </span>
    </div>

    <div class="lista-produtos" id="lista-busca">
      <div class="mensagem-vazia">
        Digite o nome de um produto acima para comparar preços entre mercados 🔍
      </div>
    </div>
  </div>

  <!-- Aba 2: Comparar Lista de Compras -->
  <div id="aba-listas" class="conteudo-aba">
    <div class="busca">
      <div class="busca-container">
        <span class="icone-busca">🔍</span>
        <input type="search" id="campo-busca-lista" placeholder="Busque produtos para adicionar à lista" autocomplete="off">
      </div>
    </div>

    <!-- Resultados de busca -->
    <div id="resultados-busca-lista" style="background: white; max-height: 300px; overflow-y: auto; display: none;"></div>

    <!-- Lista de produtos adicionados -->
    <div id="produtos-na-lista" style="background: white; padding: 16px; display: none;">
      <h3 style="font-size: 16px; margin-bottom: 12px; color: #333;">Produtos na Lista:</h3>
      <div id="itens-lista"></div>
    </div>

    <!-- Comparativo de listas -->
    <div class="comparativo-listas">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 20px; margin: 0;">Comparativo de Preços por Estabelecimento</h2>
        <button class="btn-limpar" id="btn-limpar-lista" title="Limpar lista">🗑️ Limpar</button>
      </div>

      <div class="comparativo-grid">
        <div class="mensagem-vazia">Busque e adicione produtos para comparar totais entre mercados</div>
      </div>
    </div>
  </div>

  <script src="../assets/js/comparador.js"></script>
</body>
</html>
