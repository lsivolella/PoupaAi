<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/detalhes_produto.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols" />
    <title>Detalhes Produto</title>
</head>

<body>
    <header>
        <div>
            <a href="#" class="btn btn-primary align-items-center" , id="back-button">
                <span class="material-symbols">
                    chevron_left
                </span>

            </a>
        </div>
        <div id="titulo-produto">
            {nome_produto}
        </div>
    </header>

    <body>
        <div id="barra-busca">
            <span class="material-symbols">search</span>
            <input type="text" placeholder="Buscar">
        </div>
        <div>
            <article id="card-produto">
                <div id="card-produto-esquerda">
                    <p>Aveia Integral em Flocos</p>
                    <p>Quaker</p>
                </div>
                <div id="card-produto-direita">
                    <img src="../assets/img/aveia_integral_quaker_400g.png">
                </div>
            </article>
        </div>

        <div id="mercados-container">
            <h1>Disponível em:</h1>
            <div class="card" style="width: 18rem;">
                <img class="card-img-top" src="../assets/img/arroz_branco_camil_1kg.jpg" alt="Card image cap">
                <div class="card-body">
                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the
                        card's content.</p>
                </div>
            </div>
        </div>
    </body>

    <footer>
        <div>
            [placeholder] botao adicionar produto
        </div>

        <div>
            [placeholder] barrinha
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
