<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/detalhes_produto.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <title>Detalhes Produto</title>
</head>

<body>
    <header>
        <div>
            <a href="#" class="btn align-items-center" , id="back-button">
                <span class="material-symbols">
                    chevron_left
                </span>
            </a>
        </div>
        <div id="titulo-produto">
            <h4>Detalhes Produto</h4>
        </div>
    </header>
    <main>
        <!-- <div id="barra-busca">
            <span class="material-symbols">search</span>
            <input type="text" placeholder="Buscar">
        </div> -->
        <div>
            <article id="card-produto">
                <div id="card-produto-esquerda">
                    <p>Nome Produto</p>
                    <p>Descrição Produto</p>
                    <p>Tamanho Embalagem & Unidade Medida</p>
                    <p>Marca Produto</p>
                </div>
                <div id="card-produto-direita">
                    <img src="" alt="Imagem Produto">
                </div>
            </article>
        </div>

        <div id="mercados-container">
            <h4>Disponível em:</h4>
            <div id="card-mercados-container">
                <div class="card mb-2" style="width: 100%; max-width: 800px;">
                    <div class="row g-0 align-items-center">
                        <div class="col-4">
                            <img class="card-img-left ms-2" src="" alt="logo-mercado">
                        </div>
                        <div class="col-6">
                            <div class="card-body">
                                <h5 class="card-text">Nome mercado</h5>
                                <p class="card-text">Distância</p>
                            </div>
                        </div>
                        <div class="col-2">
                            <p><strong>R$00,00</strong></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div >

        </div>

        <!-- <div>
            <a href="" class="botao-generico">Adicionar Produto</a>
        </div> -->
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="../assets/js/detalhes-produto.js"></script>

</html>
