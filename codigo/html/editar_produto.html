<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicione o produto</title>
  
  <link rel="stylesheet" href="../assets/css/editar_produto.css">
  <link rel="stylesheet" href="../assets/css/editar_produto_lista.css"> 
  <link rel="stylesheet" href="../assets/css/styles.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <header class="top-bar">
    <a href="lista.html" class="back-btn" aria-label="Voltar">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1>Adicione o produto</h1>
  </header>

  <main class="page-container">

    <section id="search-container">
      <span class="material-symbols-outlined">search</span>
      <input type="search" id="search-bar" placeholder="Buscar por nome ou marca...">
    </section>

    <section id="product-list-container"></section>

    <h2 class="form-title">Item selecionado</h2>

    <div class="form-container">

      <div class="input-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Selecione um item da lista" readonly>
      </div>

      <div class="input-group">
        <label for="marca">Marca</label>
        <input type="text" id="marca" placeholder="Marca do produto" readonly>
      </div>

      <div class="input-group">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Descrição do produto" readonly>
      </div>

      <div class="input-group quantidade-group">
        <label for="quantidade">Quantidade</label>
        <div class="quantidade-controls">
          <button id="menos" aria-label="Remover um">
            <span class="material-symbols-outlined">remove</span>
          </button>

          <input type="number" id="quantidade" value="1" min="1">

          <button id="mais" aria-label="Adicionar um">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer-editar-produto">
      <button id="btn-adicionar-produto" class="btn-editar-produto">Adicionar produto</button>
  </footer>

  <script src="../assets/js/editar_produto.js"></script>
</body>
</html>
