<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Avaliação</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script defer type="module" src="./../../assets/js/avaliacoes/editar.js"></script>
</head>

<body>

<header class="container py-4 text-center">
    <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="index.html" class="btn btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="text-center flex-grow-1">Editar Avaliação</h1>

        <!-- Espaço para manter o alinhamento -->
        <div style="width:40px;"></div>
    </div>

    <form id="form-editar">

        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <select class="form-select" id="usuarioId" required></select>
        </div>

        <div class="mb-3">
            <label class="form-label">Mercado</label>
            <select class="form-select" id="mercadoId" required></select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nota (0 a 5)</label>
            <input type="number" class="form-control" id="nota" min="0" max="5" step="0.1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Comentário</label>
            <textarea class="form-control" id="comentario" rows="4"></textarea>
        </div>

        <button class="btn btn-primary w-100 mt-3" type="submit">Salvar Alterações</button>

    </form>

</main>

</body>

</html>
