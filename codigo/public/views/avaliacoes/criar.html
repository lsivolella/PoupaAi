<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Avaliação</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/codigo/public/assets/css/style.css" />
    <script
      defer
      type="module"
      src="../../assets/js/avaliacoes/criar.js"
    ></script>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="/codigo/public/views/index.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="categories-nav">
      <div class="container">
        <ul class="categories-list">
          <li>
            <a href="/codigo/public/views/index.html"
              ><i class="bi bi-house-door"></i> Início</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/usuarios/dashboard-cliente.html"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-list-check"></i> Minhas Listas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/mercados/index.html"
              ><i class="bi bi-shop"></i> Supermercados</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/produtos/index.html"
              ><i class="bi bi-box-seam"></i> Produtos</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/comparador/index.html"
              ><i class="bi bi-arrows-angle-contract"></i> Comparador</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/alertas/index.html"
              ><i class="bi bi-bell"></i> Alertas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/historicos/index.html"
              ><i class="bi bi-clock-history"></i> Histórico</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container mt-4 mb-5">
      <a href="index.html" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>

      <h1 class="text-center mb-4">
        <i class="bi bi-star-fill text-warning"></i> Criar Avaliação
      </h1>

      <div class="card shadow-sm mx-auto" style="max-width: 600px">
        <div class="card-body p-4">
          <form id="form-avaliacao">
            <!-- Campo de usuário REMOVIDO - Auto-preenchido -->

            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="bi bi-shop"></i> Mercado
              </label>
              <select id="mercado-select" class="form-select" required>
                <option value="" disabled selected>
                  Selecione o mercado...
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="bi bi-star-fill text-warning"></i> Nota (0 a 5)
              </label>
              <input
                type="number"
                id="nota-input"
                class="form-control"
                min="0"
                max="5"
                step="0.1"
                placeholder="Ex: 4.5"
                required
              />
              <div class="form-text">
                <i class="bi bi-info-circle"></i> Digite uma nota de 0 a 5
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="bi bi-chat-left-text"></i> Comentário
              </label>
              <textarea
                id="comentario-input"
                class="form-control"
                rows="4"
                placeholder="Conte sua experiência neste mercado..."
              ></textarea>
              <div class="form-text">
                <i class="bi bi-info-circle"></i> Opcional
              </div>
            </div>

            <button
              id="salvar-btn"
              type="button"
              class="btn btn-primary w-100 mt-3 py-2"
            >
              <i class="bi bi-save"></i> Salvar Avaliação
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="/codigo/navbar.js"></script>
  </body>
</html>
