<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Avaliação</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      defer
      type="module"
      src="../../assets/js/avaliacoes/criar.js"
    ></script>
  </head>
  <body>
    <header class="container py-4 text-center">
      <img
        src="../../assets/img/Logo_PoupaAI.svg"
        class="img-fluid"
        alt="Logo Poupa Aí"
      />
    </header>

    <main class="container">
      <a href="index.html" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>

      <h1 class="text-center mb-4">Criar Avaliação</h1>

      <form id="form-avaliacao">
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <select id="usuario-select" class="form-select" required>
            <option value="" disabled selected>Selecione...</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Mercado</label>
          <select id="mercado-select" class="form-select" required>
            <option value="" disabled selected>Selecione...</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Nota (0 a 5)</label>
          <input
            type="number"
            id="nota-input"
            class="form-control"
            min="0"
            max="5"
            step="0.1"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Comentário</label>
          <textarea
            id="comentario-input"
            class="form-control"
            rows="4"
          ></textarea>
        </div>

        <button
          id="salvar-btn"
          type="button"
          class="btn btn-primary w-100 mt-3"
        >
          <i class="bi bi-save"></i> Salvar
        </button>
      </form>
    </main>
  </body>
</html>
