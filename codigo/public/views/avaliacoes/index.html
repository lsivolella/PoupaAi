<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minhas Avaliações</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css"/>
    <link rel="stylesheet" href="../../assets/css/login.css"/>
    <script
      defer
      type="module"
      src="./../../assets/js/avaliacoes/visualizar.js"
    ></script>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="../../views/index.html">
            <img
              src="../../assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="categories-nav">
      <div class="container">
        <ul class="categories-list">
          <li>
            <a href="/codigo/public/views/index.html"
              ><i class="bi bi-house-door"></i> Início</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/usuarios/dashboard-cliente.html"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-list-check"></i> Minhas Listas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/mercados/index.html"
              ><i class="bi bi-shop"></i> Supermercados</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/produtos/index.html"
              ><i class="bi bi-box-seam"></i> Produtos</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/comparar/index.html"
              ><i class="bi bi-arrows-angle-contract"></i> Comparador</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/alertas/index.html"
              ><i class="bi bi-bell"></i> Alertas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/historicos/index.html"
              ><i class="bi bi-clock-history"></i> Histórico</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container mt-4 mb-5">
      <a href="../mercados/index.html" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>

      <h1 class="text-center mb-4">
        <i class="bi bi-star-fill text-warning"></i> Minhas Avaliações
      </h1>

      <div class="d-flex justify-content-end mb-3">
        <a href="criar.html" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Nova Avaliação
        </a>
      </div>

      <table class="table table-hover">
        <thead class="table-light">
          <tr>
            <th>Mercado / Data</th>
            <th class="text-center">Avaliação</th>
            <th>Comentário</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-avaliacoes"></tbody>
      </table>
    </main>

    <script src="../../../navbar.js"></script>
  </body>
</html>
