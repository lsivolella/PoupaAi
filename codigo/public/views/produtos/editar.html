<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Produto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script defer type="module" src="../../assets/js/produtos/editar.js"></script>
</head>
<body>

<header class="container py-4 text-center">
  <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

  <a href="index.html" class="btn btn-outline-secondary mb-3">
     <i class="bi bi-arrow-left"></i>
  </a>

  <h1 class="text-center mb-4">Editar Produto</h1>

  <form>

    <div class="mb-3">
      <label class="form-label">ID</label>
      <input type="text" id="id-input" class="form-control" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" id="nome-input" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Categoria</label>
      <select id="categoria-select" class="form-select">
        <option value="Alimentos">Alimentos</option>
        <option value="Limpeza">Limpeza</option>
        <option value="Higiene">Higiene</option>
        <option value="Bebidas">Bebidas</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Preço</label>
      <input type="number" id="preco-input" class="form-control" step="0.01">
    </div>

    <div class="mb-3">
      <label class="form-label">Imagem (URL)</label>
      <input type="text" id="imagem-input" class="form-control">
    </div>

    <button id="atualizar-btn" type="button" class="btn btn-success w-100 mt-3">
      <i class="bi bi-check-circle"></i> Atualizar
    </button>

  </form>

</main>

</body>
</html>
