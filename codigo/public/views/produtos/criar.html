  <script defer type="module" src="../../assets/js/produtos/criar.js"></script>

<body>

<header class="container py-4 text-center">
  <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

  <a href="index.html" class="btn btn-outline-secondary">
     <i class="bi bi-arrow-left"></i>
  </a>

  <h1 class="text-center mb-4">Cadastrar Produto</h1>

  <form id="form-produto">

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" id="nome-input" class="form-control">
    </div>
  
    <div class="mb-3">
      <label class="form-label">Categoria</label>
      <select id="categoria-select" class="form-select">
        <option value="" disabled selected>Selecione...</option>
        <option value="Alimentos">Alimentos</option>
        <option value="Limpeza">Limpeza</option>
        <option value="Higiene">Higiene</option>
        <option value="Bebidas">Bebidas</option>
      </select>
    </div>
  
    <div class="mb-3">
      <label class="form-label">Preço</label>
      <input type="number" id="preco-input" class="form-control" step="0.01">
    </div>
  
    <div class="mb-3">
      <label class="form-label">Marca</label>
      <input type="text" id="marca-input" class="form-control">
    </div>
  
    <div class="mb-3">
      <label class="form-label">Unidade de Medida</label>
      <input type="text" id="unidade-input" class="form-control" placeholder="Ex: kg, L, pacote">
    </div>
  
    <div class="mb-3">
      <label class="form-label">Tamanho da Embalagem</label>
      <input type="number" id="tamanho-input" class="form-control" placeholder="Ex: 1, 2, 500">
    </div>
  
    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea id="descricao-input" class="form-control" rows="3"></textarea>
    </div>
  
    <div class="mb-3">
      <label class="form-label">Mercado</label>
      <select id="mercado-select" class="form-select">
        <option value="" disabled selected>Selecione...</option>
      </select>
    </div>
  
    <div class="mb-3">
      <label class="form-label">Imagem (URL)</label>
      <input type="text" id="imagem-input" class="form-control">
    </div>
  
    <button id="salvar-btn" type="button" class="btn btn-primary w-100 mt-3">
      <i class="bi bi-save"></i> Salvar
    </button>
  
  </form>  

</main>
