<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produtos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css"/>
    <link rel="stylesheet" href="../../assets/css/login.css"/>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script
      defer
      type="module"
      src="../../assets/js/produtos/comparar.js"
    ></script>
    <script
      defer
      type="module"
      src="../../assets/js/produtos/visualizar.js"
    ></script>
    <script
      defer
      type="module"
      src="../../assets/js/produtos/categoria.js"
    ></script>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="/codigo/public/views/index.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="categories-nav">
      <div class="container">
        <ul class="categories-list">
          <li>
            <a href="/codigo/public/views/index.html"
              ><i class="bi bi-house-door"></i> Início</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/usuarios/dashboard-cliente.html"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-list-check"></i> Minhas Listas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/mercados/index.html"
              ><i class="bi bi-shop"></i> Supermercados</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/produtos/index.html" class="active"
              ><i class="bi bi-box-seam"></i> Produtos</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/comparador/index.html"
              ><i class="bi bi-arrows-angle-contract"></i> Comparador</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/alertas/index.html"
              ><i class="bi bi-bell"></i> Alertas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/historicos/index.html"
              ><i class="bi bi-clock-history"></i> Histórico</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container mt-4">
      <a href="../../views/index.html" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i>
      </a>

      <ul class="nav nav-tabs mb-3" id="abasProdutos" role="tablist">
        <li class="nav-item">
          <button
            class="nav-link active"
            id="tab-busca"
            data-bs-toggle="tab"
            data-bs-target="#aba-busca"
          >
            Buscar Produtos
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            id="tab-categoria"
            data-bs-toggle="tab"
            data-bs-target="#aba-categoria"
          >
            Por Categoria
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            id="tab-lista"
            data-bs-toggle="tab"
            data-bs-target="#aba-lista"
          >
            Lista de Produtos
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Aba 1: Buscar Produtos -->
        <div class="tab-pane fade show active" id="aba-busca">
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input
              type="text"
              id="campo-busca-produtos"
              class="form-control"
              placeholder="Pesquise o produto (ex: arroz, feijão...)"
            />
          </div>
          <div id="lista-busca-produtos" class="mb-3">
            <div class="alert alert-secondary text-center">
              Digite o nome de um produto acima para buscar
            </div>
          </div>
        </div>

        <!-- Aba 2: Por Categoria -->
        <div class="tab-pane fade" id="aba-categoria">
          <!-- Filtro de categorias -->
          <div class="mb-3">
            <label for="select-categoria" class="form-label fw-bold">
              <i class="bi bi-funnel"></i> Filtrar por Categoria:
            </label>
            <select id="select-categoria" class="form-select">
              <option value="">Todas as Categorias</option>
              <option value="ofertas">Ofertas</option>
              <option value="hortifruti">Hortifruti</option>
              <option value="acougue">Açougue</option>
              <option value="bebe">Mundo Bebê</option>
              <option value="limpeza">Limpeza</option>
              <option value="bebidas">Bebidas</option>
              <option value="padaria">Padaria</option>
              <option value="alimentos">Alimentos</option>
            </select>
          </div>

          <!-- Título dinâmico -->
          <h5 id="titulo-categoria" class="mb-3">
            <i class="bi bi-box-seam"></i> Produtos
          </h5>

          <!-- Lista de produtos por categoria -->
          <div id="lista-categoria-produtos">
            <div class="alert alert-secondary text-center">
              Selecione uma categoria acima para ver os produtos
            </div>
          </div>
        </div>

        <!-- Aba 3: Lista de produtos cadastrados -->
        <div class="tab-pane fade" id="aba-lista">
          <div class="d-flex justify-content-end mb-3">
            <a href="criar.html" class="btn btn-primary"
              ><i class="bi bi-plus-lg"></i> Cadastrar Produto</a
            >
          </div>
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Imagem</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/codigo/navbar.js"></script>
  </body>
</html>
