<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excluir Produto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script  defer type="module" src="../../assets/js/produtos/excluir.js"></script>
</head>
<body>

<header class="container py-4 text-center">
  <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

    <a href="index.html" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i>
    </a>

  <h1 class="text-center mb-4 text-danger">Excluir Produto</h1>

  <p class="text-center fs-5">Tem certeza que deseja excluir este produto?</p>

  <div class="d-flex justify-content-center gap-3 mt-4">
    <button class="btn btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
    <button id="btn-excluir" class="btn btn-danger">Excluir</button>
  </div>

</main>

<script>
  document.querySelector("#btn-excluir").addEventListener("click", () => {
    const id = sessionStorage.getItem("id");
    import('../../assets/js/produtos/excluir.js').then(mod => {
      mod.confirmarExcluirERecarregar(id);
    });
  });
</script>

</body>
</html>
