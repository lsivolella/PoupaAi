<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa de Mercados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="/codigo/public/assets/css/style.css" />
    <script defer src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script defer type="module" src="../../assets/js/mercados/mapa.js"></script>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="/codigo/public/views/index.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <a href="index.html" class="btn btn-outline-secondary mb-3 mt-3">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>

      <div class="search-bar mb-3">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Buscar por mercados no mapa" />
      </div>

      <div
        id="map"
        style="height: 600px; border-radius: 8px; margin-bottom: 20px"
      ></div>
      <div id="status" class="alert alert-info">Obtendo localização...</div>
    </main>

    <footer class="text-center py-3 mt-5" style="background: #f8f9fa">
      <p class="mb-0 text-muted">
        © 2025 PoupaAí. Todos os direitos reservados.
      </p>
    </footer>

    <script src="/codigo/navbar.js"></script>
  </body>
</html>
