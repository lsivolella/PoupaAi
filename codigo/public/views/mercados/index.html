<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mercados</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script defer type="module" src="../../assets/js/mercados/visualizar.js"></script>
</head>

<body>
  <header class="container py-4 text-center">
    <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
  </header>

  <main class="container my-4">

    <div class="d-flex justify-content-between mb-4">
      <a href="index.html" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> 
      </a>
      <a href="criar.html" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Cadastrar Mercado
      </a>
    </div>

    <!-- Barra de pesquisa -->
    <div class="search-bar">
      <i class="bi bi-search"></i>
      <input type="text" id="pesquisa-mercado" placeholder="Pesquisar por nome...">
    </div>

    <!-- Filtros -->
    <div class="filtros-container">
      <div class="filtros">
        <button id="filtro-todos" class="botao-filtro ativo">Todos</button>
        <button id="filtro-acessivel" class="botao-filtro">♿ Com Acessibilidade</button>
        <button id="filtro-sem-acessibilidade" class="botao-filtro">Sem Acessibilidade</button>
      </div>
    </div>

    <!-- Cards -->
    <div id="cards-mercados" class="row g-4 mt-3"></div>
  </main>
</body>
</html>
