<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/codigo/public/assets/css/style.css" />
    <script
      defer
      type="module"
      src="../../assets/js/mercados/visualizar.js"
    ></script>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="/codigo/public/views/index.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="categories-nav">
      <div class="container">
        <ul class="categories-list">
          <li>
            <a href="/codigo/public/views/index.html"
              ><i class="bi bi-house-door"></i> Início</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-list-check"></i> Minhas Listas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/mercados/index.html" class="active"
              ><i class="bi bi-shop"></i> Supermercados</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/produtos/index.html"
              ><i class="bi bi-box-seam"></i> Produtos</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/comparador/index.html"
              ><i class="bi bi-arrows-angle-contract"></i> Comparador</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/alertas/index.html"
              ><i class="bi bi-bell"></i> Alertas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/historicos/index.html"
              ><i class="bi bi-clock-history"></i> Histórico</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container my-4">
      <div class="d-flex justify-content-between mb-4">
        <a href="index.html" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <a href="criar.html" class="btn btn-primary" id="cadastraBtn">
          <i class="bi bi-plus-lg"></i> Cadastrar Mercado
        </a>
      </div>

      <div class="search-bar">
        <i class="bi bi-search"></i>
        <input
          type="text"
          id="pesquisa-mercado"
          placeholder="Pesquisar por nome..."
        />
      </div>

      <div class="filtros-container">
        <div class="filtros">
          <button id="filtro-todos" class="botao-filtro ativo">Todos</button>
          <button id="filtro-acessivel" class="botao-filtro">
            ♿ Com Acessibilidade
          </button>
          <button id="filtro-sem-acessibilidade" class="botao-filtro">
            Sem Acessibilidade
          </button>
        </div>
      </div>

      <div id="cards-mercados" class="row g-4 mt-3"></div>
    </main>

    <script src="/codigo/navbar.js"></script>
  </body>
</html>
