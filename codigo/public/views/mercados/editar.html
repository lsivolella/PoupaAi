<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Mercado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css"/>
    <link rel="stylesheet" href="../../assets/css/login.css"/>
    <script
      defer
      type="module"
      src="../../assets/js/mercados/editar.js"
    ></script>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="/codigo/public/views/index.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="categories-nav">
      <div class="container">
        <ul class="categories-list">
          <li>
            <a href="/codigo/public/views/index.html"
              ><i class="bi bi-house-door"></i> Início</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/index.html"
              ><i class="bi bi-list-check"></i> Minhas Listas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/mercados/index.html" class="active"
              ><i class="bi bi-shop"></i> Supermercados</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/produtos/index.html"
              ><i class="bi bi-box-seam"></i> Produtos</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/comparador/index.html"
              ><i class="bi bi-arrows-angle-contract"></i> Comparador</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/alertas/index.html"
              ><i class="bi bi-bell"></i> Alertas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/historicos/index.html"
              ><i class="bi bi-clock-history"></i> Histórico</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container">
      <a href="index.html" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i>
      </a>

      <h1 class="text-center mb-4">Editar Mercado</h1>

      <form id="formEditar">
        <div class="mb-3">
          <label class="form-label">Nome do Mercado</label>
          <input type="text" id="nomeMercado" class="form-control" required />
        </div>

        <fieldset class="border rounded p-3 mb-4">
          <legend class="float-none w-auto px-2 fs-5">Endereço</legend>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">CEP</label>
              <input type="text" id="cepMercado" class="form-control" />
            </div>
            <div class="col-md-8">
              <label class="form-label">Rua</label>
              <input type="text" id="ruaMercado" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Número</label>
              <input type="text" id="numeroMercado" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Bairro</label>
              <input type="text" id="bairroMercado" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Cidade</label>
              <input type="text" id="cidadeMercado" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <input type="text" id="estadoMercado" class="form-control" />
            </div>
            <div class="col-md-12">
              <label class="form-label">País</label>
              <input type="text" id="paisMercado" class="form-control" />
            </div>
          </div>
        </fieldset>

        <fieldset class="border rounded p-3 mb-4">
          <legend class="float-none w-auto px-2 fs-5">Contato</legend>
          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input
              type="text"
              id="telefoneMercado"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" id="emailMercado" class="form-control" />
          </div>
        </fieldset>

        <div class="mb-3">
          <label class="form-label">URL da Logo</label>
          <input type="text" id="logoMercado" class="form-control" />
        </div>

        <div class="mb-3">
          <label class="form-label">Acessibilidade</label>
          <select
            id="acessibilidadeMercado"
            class="form-select"
            multiple
          ></select>
          <small class="text-muted"
            >Use CTRL (ou CMD no Mac) para selecionar várias opções</small
          >
        </div>

        <button type="submit" class="btn btn-primary mt-3 w-100">
          Salvar Alterações
        </button>
      </form>
    </main>

    <script src="/codigo/navbar.js"></script>
  </body>
</html>
