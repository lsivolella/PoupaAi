<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editar Mercado</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script defer type="module" src="../../assets/js/mercados/editar.js"></script>
</head>

<body>
  <header class="container py-4 text-center">
    <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
  </header>

  <main class="container">
    <a href="index.html" class="btn btn-outline-secondary mb-3">
      <i class="bi bi-arrow-left"></i>
    </a>

    <h1 class="text-center mb-4">Editar Mercado</h1>

    <form id="formEditar">
      <!-- Nome do Mercado -->
      <div class="mb-3">
        <label class="form-label">Nome do Mercado</label>
        <input type="text" id="nomeMercado" class="form-control" required>
      </div>

      <!-- Endereço -->
      <fieldset class="border rounded p-3 mb-4">
        <legend class="float-none w-auto px-2 fs-5">Endereço</legend>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">CEP</label>
            <input type="text" id="cepMercado" class="form-control">
          </div>
          <div class="col-md-8">
            <label class="form-label">Rua</label>
            <input type="text" id="ruaMercado" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Número</label>
            <input type="text" id="numeroMercado" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Bairro</label>
            <input type="text" id="bairroMercado" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Cidade</label>
            <input type="text" id="cidadeMercado" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Estado</label>
            <input type="text" id="estadoMercado" class="form-control">
          </div>
          <div class="col-md-12">
            <label class="form-label">País</label>
            <input type="text" id="paisMercado" class="form-control">
          </div>
        </div>
      </fieldset>

      <!-- Contato -->
      <fieldset class="border rounded p-3 mb-4">
        <legend class="float-none w-auto px-2 fs-5">Contato</legend>
        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input type="text" id="telefoneMercado" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" id="emailMercado" class="form-control">
        </div>
      </fieldset>

      <!-- Logo -->
      <div class="mb-3">
        <label class="form-label">URL da Logo</label>
        <input type="text" id="logoMercado" class="form-control">
      </div>

      <!-- Acessibilidades -->
      <div class="mb-3">
        <label class="form-label">Acessibilidade</label>
        <select id="acessibilidadeMercado" class="form-select" multiple>
        </select>
        <small class="text-muted">Use CTRL (ou CMD no Mac) para selecionar várias opções</small>
      </div>

      <button type="submit" class="btn btn-primary mt-3 w-100">Salvar Alterações</button>
    </form>
  </main>
</body>
</html>
