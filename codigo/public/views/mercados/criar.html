<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Mercado</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script defer type="module" src="../../assets/js/mercados/criar.js"></script>
</head>
<body>

<header class="container py-4 text-center">
  <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

  <a href="index.html" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>

  <h1 class="text-center mb-4">Cadastrar Mercado</h1>

  <form id="form-mercado">

    <!-- Nome do Mercado -->
    <div class="mb-3">
      <label class="form-label">Nome do Mercado</label>
      <input type="text" id="nome-input" class="form-control">
    </div>

    <!-- Endereço -->
    <fieldset class="border rounded p-3 mb-4">
      <legend class="float-none w-auto px-2 fs-5 mb-0">Endereço</legend>

      <div class="row g-3 mt-1">

        <div class="col-md-4">
          <label class="form-label">CEP</label>
          <input type="text" id="cep-input" class="form-control">
        </div>

        <div class="col-md-8">
          <label class="form-label">Rua</label>
          <input type="text" id="rua-input" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label">Número</label>
          <input type="text" id="numero-input" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Bairro</label>
          <input type="text" id="bairro-input" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Cidade</label>
          <input type="text" id="cidade-input" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Estado</label>
          <input type="text" id="estado-input" class="form-control">
        </div>

        <div class="col-md-12">
          <label class="form-label">País</label>
          <input type="text" id="pais-input" class="form-control">
        </div>

      </div>
    </fieldset>

    <!-- Contato -->
    <fieldset class="border rounded p-3 mb-4">
      <legend class="float-none w-auto px-2 fs-5 mb-0">Contato</legend>

      <div class="mt-1">
        <label class="form-label">Telefone</label>
        <input type="text" id="telefone-input" class="form-control mb-3">

        <label class="form-label">E-mail</label>
        <input type="email" id="email-input" class="form-control">
      </div>
    </fieldset>

    <!-- Acessibilidade -->
    <div class="mb-3">
      <label class="form-label">Acessibilidade</label>
      <select id="acessibilidade-select" class="form-select" multiple>
        <option value="1">Rampa de acesso</option>
        <option value="2">Elevador</option>
        <option value="3">Piso Tátil</option>
        <option value="4">Braille</option>
      </select>
      <small class="text-muted">Use CTRL para selecionar várias opções</small>
    </div>

    <div class="mb-3">
      <label class="form-label">URL da Logo</label>
      <input type="text" id="logo-input" class="form-control" placeholder="https://exemplo.com/logo.png">
    </div>

    <!-- Botão -->
    <button id="salvar-btn" type="button" class="btn btn-primary w-100 mt-3">
      <i class="bi bi-save"></i> Salvar
    </button>

  </form>

</main>

</body>
</html>
