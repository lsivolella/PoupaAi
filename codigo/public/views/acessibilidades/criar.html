<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar Acessibilidade</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script defer type="module" src="../../assets/js/acessibilidades/criar.js"></script>
</head>
<body>

<header class="container py-4 text-center">
  <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

  <a href="index.html" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>

  <h1 class="text-center mb-4">Criar Acessibilidade</h1>

  <form id="form-acessibilidade">

    <div class="mb-3">
      <label class="form-label">Tipo de Acessibilidade</label>
      <input type="text" id="tipo-input" class="form-control" placeholder="Ex: Rampa de acesso" required>
    </div>

    <button id="salvar-btn" type="submit" class="btn btn-primary w-100 mt-3">
      <i class="bi bi-save"></i> Salvar
    </button>

  </form>

</main>

</body>
</html>
