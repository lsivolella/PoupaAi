<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Acessibilidade</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css"/>
    <link rel="stylesheet" href="../../assets/css/login.css"/>
    <script
      defer
      type="module"
      src="../../assets/js/acessibilidades/editar.js"
    ></script>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="/codigo/public/views/index.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="index.html" class="btn btn-outline-secondary mb-3">
          <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="text-center flex-grow-1">Editar Acessibilidade</h1>

        <div style="width: 40px"></div>
      </div>

      <form id="form-editar">
        <div class="mb-3">
          <label class="form-label">Tipo de Acessibilidade</label>
          <input type="text" class="form-control" id="tipo" required />
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">
          Salvar Alterações
        </button>
      </form>
    </main>
    <script src="/codigo/navbar.js"></script>
  </body>
</html>
