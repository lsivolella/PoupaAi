<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Lista de Compras</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css"/>
    <link rel="stylesheet" href="../../assets/css/login.css"/>
    <script defer type="module" src="../../assets/js/listas/criar.js"></script>
  </head>

  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="../../views/index.html">
            <img
              src="../../assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí"
              class="logo-img"
            />
          </a>
        </div>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Busque usando vírgula, ex: leite, cerveja, azeite, arroz, iogurte"
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i>
            BUSCAR
          </button>
        </div>

        <div class="user-actions">
          <button class="user-btn action-btn" id="loginBtn">
            <i class="bi bi-person-circle"></i>
            <span>Entrar</span>
          </button>

          <div class="user-logged" id="userLogged" style="display: none">
            <div class="user-info">
              <img
                src="/codigo/public/assets/img/Avatar_Usuario.svg"
                alt="Avatar"
                class="user-avatar"
                id="userAvatar"
              />
              <span class="user-greeting" id="userGreeting">Olá, Usuário!</span>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Sair">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>

          <button class="cart-btn action-btn" id="cartBtn">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="index.html" class="btn btn-outline-secondary mb-3">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="text-center flex-grow-1">Criar Lista</h1>
        <div style="width: 40px"></div>
      </div>

      <form id="formLista">
        <div class="mb-3" style="display: none;">
          <label for="usuario" class="form-label">Usuário</label>
          <select id="usuario" class="form-select"></select>
        </div>

        <div class="mb-3">
          <label for="valor" class="form-label">Valor Total</label>
          <input type="number" step="0.01" class="form-control" id="valor" />
        </div>

        <fieldset class="border rounded p-3 mb-4">
          <legend class="float-none w-auto px-2 fs-5">Produtos</legend>

          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <label class="form-label">Produto</label>
              <select id="produto" class="form-select"></select>
            </div>

            <div class="col-md-3">
              <label class="form-label">Quantidade</label>
              <input type="number" id="quantidade" class="form-control" />
            </div>

            <div class="col-md-3">
              <label class="form-label">Valor Unitário</label>
              <input
                type="number"
                step="0.01"
                id="valorUnitario"
                class="form-control"
              />
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button
                type="button"
                id="addProduto"
                class="btn btn-success w-100"
              >
                <i class="bi bi-plus"></i>
              </button>
            </div>
          </div>

          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Valor Unit.</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="itensLista"></tbody>
          </table>
        </fieldset>

        <button type="submit" class="btn btn-primary w-100">
          Salvar Lista
        </button>
      </form>
    </main>
    <script src="../../../navbar.js"></script>
  </body>
</html>
