<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Lista</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script defer type="module" src="../assets/js/listas/editar.js"></script>
</head>

<body>

<header class="container py-4 text-center">
    <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="index.html" class="btn btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="text-center flex-grow-1">Editar Lista</h1>
        <div style="width:40px;"></div>
    </div>

    <form id="formLista">

        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <select id="usuario" class="form-select"></select>
        </div>

        <div class="mb-3">
            <label class="form-label">Valor Total</label>
            <input type="number" step="0.01" class="form-control" id="valor">
        </div>

        <fieldset class="border rounded p-3 mb-4">
            <legend class="float-none w-auto px-2 fs-5">Produtos</legend>

            <div class="row g-2 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Produto</label>
                    <select id="produto" class="form-select"></select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Qtd</label>
                    <input type="number" id="quantidade" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Valor Unitário</label>
                    <input type="number" step="0.01" id="valorUnitario" class="form-control">
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" id="addProduto" class="btn btn-success w-100">
                        <i class="bi bi-plus"></i>
                    </button>
                </div>
            </div>

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th>Valor Unit.</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="itensLista"></tbody>
            </table>
        </fieldset>

        <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>

    </form>

</main>


</body>
</html>
