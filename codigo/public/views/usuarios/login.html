<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/codigo/public/assets/css/style.css"/>
    <link rel="stylesheet" href="/codigo/public/assets/css/login.css"/>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <img
            src="/codigo/public/assets/img/Logo_PoupaAI.svg"
            alt="PoupaAí"
            class="logo-auth"
          />
        </div>

        <h2 class="text-center mb-4">Bem-vindo!</h2>

        <div id="alert-container"></div>

        <form id="form-login">
          <div class="mb-3">
            <label for="email" class="form-label">
              <i class="bi bi-envelope"></i> E-mail
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="seu@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">
              <i class="bi bi-lock"></i> Senha
            </label>
            <div class="password-input">
              <input
                type="password"
                class="form-control"
                id="senha"
                placeholder="••••••••"
                required
              />
              <button
                type="button"
                class="btn-toggle-password"
                id="toggle-password"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="lembrar" />
            <label class="form-check-label" for="lembrar"> Lembrar-me </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
          </button>

          <div class="text-center">
            <p class="mb-2">
              Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
            <p class="mb-0">
              <a href="login-admin.html" class="text-muted">Acesso Admin</a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <script
      type="module"
      src="/codigo/public/assets/js/usuarios/login.js"
    ></script>
  </body>
</html>
