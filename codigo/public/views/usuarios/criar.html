<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Usuário</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script defer type="module" src="../../assets/js/usuarios/criar.js"></script>
</head>
<body>

<header class="container py-4 text-center">
    <img src="../../assets/img/Logo_PoupaAI.svg" class="img-fluid" alt="Logo Poupa Aí">
</header>

<main class="container">

  <a href="index.html" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>

  <h1 class="text-center mb-4">Cadastrar Usuário</h1>

  <form id="form-usuario">

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" id="nome-input" class="form-control" placeholder="Ex: Sofia" required>
    </div>

    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" id="email-input" class="form-control" placeholder="Ex: sofia@email.com" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" id="senha-input" class="form-control" placeholder="Digite uma senha" required>
    </div>

    <button id="salvar-btn" type="submit" class="btn btn-primary w-100 mt-3">
      <i class="bi bi-save"></i> Cadastrar
    </button>

  </form>

</main>

</body>
</html>
