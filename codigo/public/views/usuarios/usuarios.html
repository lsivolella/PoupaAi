<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Usuários</title>
    <link rel="stylesheet" href="/codigo/public/assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="page-internal page-admin">
    <header class="navbar navbar-admin">
      <div class="navbar-container">
        <div class="logo">
          <a href="dashboard-admin.html">
            <img
              src="/codigo/public/assets/img/Logo_PoupaAI_Branco.svg"
              alt="PoupaAí Admin"
              class="logo-img"
            />
            <span class="admin-badge-nav">ADMIN</span>
          </a>
        </div>
        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar usuários..."
            class="search-input"
          />
          <button class="search-button" id="searchButton">
            <i class="bi bi-search"></i> BUSCAR
          </button>
        </div>
        <div class="user-actions">
          <button class="btn-logout" id="logoutBtn" title="Sair">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
    </header>

    <nav class="categories-nav">
      <div class="container">
        <ul class="categories-list">
          <li>
            <a href="dashboard-admin.html"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="usuarios.html" class="active"
              ><i class="bi bi-people"></i> Usuários</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/produtos/editar.html"
              ><i class="bi bi-box-seam"></i> Produtos</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/mercados/index.html"
              ><i class="bi bi-shop"></i> Supermercados</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/listas/editar.html"
              ><i class="bi bi-list-check"></i> Listas</a
            >
          </li>
          <li>
            <a href="/codigo/public/views/alertas/gerenciar.html"
              ><i class="bi bi-bell"></i> Alertas</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="main-content">
      <div class="container">
        <div class="page-header">
          <div class="page-title-wrapper">
            <i class="bi bi-people page-icon"></i>
            <h1 class="page-title">Gerenciar Usuários</h1>
          </div>
          <p class="page-subtitle">Lista completa de usuários cadastrados</p>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <i class="bi bi-person-lines-fill"></i> Usuários
            </h2>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table-modern" id="usuariosTable">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Cadastro</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="usuariosTableBody">
                  <tr>
                    <td colspan="4" class="text-center py-5">
                      <div class="spinner"></div>
                      <p class="mt-3 text-muted">Carregando usuários...</p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer footer-admin">
      <div class="container">
        <p>&copy; 2025 PoupaAí - Painel Administrativo</p>
      </div>
    </footer>

    <script src="/codigo/public/assets/js/usuarios/usuarios.js"></script>
  </body>
</html>
